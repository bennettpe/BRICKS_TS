# bricks Multi-Region Operation (MRO) peer catalogue.
# One reachable peer region per line.
#
# Format: name:host:port:token[:pin]
#   name  -- the peer's mro_name (1..8 alphanumeric); a transactions.conf
#            tag [name] routes to it.
#   host  -- DNS name or IP of the peer.
#   port  -- the peer's mro_port (1025..65535).
#   token -- the peer's own mro_token (8 to 24 alphanumeric). Presented
#            over TLS to authenticate this region to the peer. Clear text;
#            never logged.
#   pin   -- OPTIONAL hex SHA-256 fingerprint of the peer's certificate, to
#            harden against man-in-the-middle. Omit in the default
#            self-signed + token model.
#
# Blank lines and # comments are ignored. Malformed or duplicate rows are
# skipped with a logged warning (the token value is never logged). A missing
# file is fine -- this region simply has no peers.
#
# Prefer editing with CEDA MRO (validates and refreshes the live router with
# no restart). See MRO.md for the full guide.
#
# Example (uncomment and adapt):
# DBREG1:dbreg1.example.com:1055:Token1234567890abcdefABC
DOR1:some.server.com:9997:123456789012345678901234
